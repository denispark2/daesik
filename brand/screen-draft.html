<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 첫 화면 시안 (포스터 색 + 박대식 레이아웃)</title>
<!-- 레이아웃: 박대식이 보낸 첫 화면 이미지(로고, 작은 머리글, 큰 제목, 기차 시간 카드, 머물 시간 묶음 버튼, 동행 2×2, 아래 큰 버튼).
     디자인: 코스 화면(screen-course.html)과 같은 인상파 포스터 색·가는 글자. 큰 카드 바탕에 포스터를 흐리게 깔고, 오른쪽 위 장식은 ACC 건물 선을 단순하게 새로 그림.
     포스터: ACC 현재전시 〈인상파, 찬란한 순간들〉 (저작권 ACC·주최 측, 팀 시안 확인용). 17:00은 예시 (상상) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --deep:#2D353A; --deep2:#414C50; --sage:#748077; --mist:#9BA191; --ivory:#F2EFE8; --pale:#CBC8C4; --rose:#D58FA2; --ink:#2D353A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#C9CCC4; display:flex; justify-content:center; padding:24px 0;
         font-family:"Noto Sans KR","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  .phone { width:390px; height:844px; background:var(--ivory); color:var(--ink); border-radius:36px; overflow:hidden; position:relative; letter-spacing:-.2px; }

  /* 오른쪽 위 장식: ACC 건물 선 (새로 그림) */
  .deco { position:absolute; top:0; right:0; }

  /* 로고 */
  .logo { position:absolute; top:52px; left:20px; display:flex; align-items:center; gap:8px; }
  .logo b { font-size:12.5pt; font-weight:500; letter-spacing:2px; line-height:1.15; color:var(--deep); }

  /* 머리글 · 제목 */
  .eyebrow { position:absolute; top:124px; left:20px; font-size:11pt; font-weight:500; color:var(--rose); letter-spacing:.5px; }
  .h1 { position:absolute; top:150px; left:20px; font-size:24pt; font-weight:300; line-height:1.3; letter-spacing:-.4px; }
  .h1 strong { font-weight:500; }
  .lead { position:absolute; top:244px; left:20px; right:20px; font-size:11pt; font-weight:300; color:var(--deep2); }

  /* 기차 시간 카드 */
  .time { position:absolute; top:286px; left:14px; right:14px; height:150px; color:#F7F5EF; border-radius:24px; padding:18px 22px; }
  .time .bgimg { position:absolute; inset:0; border-radius:24px; overflow:hidden; }
  .time .bgimg::before { content:""; position:absolute; inset:-20px; background:url(screen-draft-poster.jpg) center 70%/cover; filter:blur(10px) saturate(1.1); }
  .time .bgimg::after { content:""; position:absolute; inset:0; background:linear-gradient(120deg,rgba(45,53,58,.92) 0%,rgba(45,53,58,.78) 55%,rgba(65,76,80,.55) 100%); }
  .time > *:not(.bgimg) { position:relative; }
  .time .k { font-size:10.5pt; font-weight:400; color:var(--pale); letter-spacing:1px; display:flex; align-items:center; gap:8px; }
  .time .k::before { content:""; width:3px; height:14px; background:var(--rose); border-radius:2px; }
  .time .v { font-size:48pt; font-weight:300; line-height:1.1; letter-spacing:1px; margin-top:4px; }
  .time .hint { font-size:9.5pt; font-weight:300; color:var(--pale); }
  .time .ctl { position:absolute; right:22px; top:58px; display:flex; align-items:center; gap:14px; }

  /* 머물 시간 */
  .label { position:absolute; top:452px; left:20px; font-size:10.5pt; font-weight:400; color:var(--sage); }
  .seg { position:absolute; top:478px; left:14px; right:14px; height:52px; display:grid; grid-template-columns:1fr 1fr 1fr;
         background:rgba(255,255,255,.5); border:1px solid var(--pale); border-radius:16px; overflow:hidden; }
  .seg button { border:0; background:transparent; font-family:inherit; font-size:13pt; font-weight:400; color:var(--deep); position:relative; }
  .seg button + button::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:1px; background:var(--pale); }

  /* 동행 */
  .title { position:absolute; top:552px; left:20px; font-size:16pt; font-weight:500; letter-spacing:.3px; }
  .grid { position:absolute; top:592px; left:14px; right:14px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { position:relative; height:62px; border:1px solid var(--pale); border-radius:16px; background:rgba(255,255,255,.5);
          display:flex; align-items:center; gap:12px; padding:0 16px; font-family:inherit; font-size:13pt; font-weight:400; color:var(--deep); text-align:left; }
  .card svg { stroke:var(--deep); flex:0 0 auto; }
  .card.on { background:rgba(116,128,119,.18); border:1.5px solid var(--sage); font-weight:500; }
  .card.on svg { stroke:var(--sage); }
  .card .check svg, .card.on .check svg { stroke:#fff; }
  .card .check { position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:var(--sage); display:flex; align-items:center; justify-content:center; }

  /* 코스 받기 */
  .go { position:absolute; left:14px; right:14px; bottom:22px; height:60px; border:0; border-radius:18px; background:var(--deep); color:#F7F5EF;
        font-family:inherit; font-size:14pt; font-weight:500; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:12px; }
  .go .arr { position:absolute; right:22px; }
</style>
</head>
<body>
<div class="phone">
  <!-- 장식: ACC 건물 선 (포스터 색, 새로 그림) -->
  <svg class="deco" width="170" height="210" viewBox="0 0 170 210" aria-hidden="true">
    <path d="M60 30 L170 0 V120 L60 140 Z" fill="#CBC8C4" opacity=".55"/>
    <path d="M10 130 L170 96 V150 L10 170 Z" fill="#9BA191" opacity=".55"/>
    <path d="M40 120 L170 92 V112 L40 138 Z" fill="#748077"/>
    <g fill="#F2EFE8"><rect x="96" y="114" width="7" height="44"/><rect x="122" y="108" width="7" height="46"/><rect x="148" y="103" width="7" height="48"/></g>
    <path d="M40 138 L170 112" stroke="#2D353A" stroke-width="1" opacity=".35"/>
  </svg>

  <!-- 로고 -->
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><g fill="#748077"><path d="M15 2 Q18 12 15 15 Q12 12 15 2 Z"/><path d="M15 28 Q12 18 15 15 Q18 18 15 28 Z"/><path d="M2 15 Q12 12 15 15 Q12 18 2 15 Z"/><path d="M28 15 Q18 18 15 15 Q18 12 28 15 Z"/></g><circle cx="15" cy="15" r="2.4" fill="#D58FA2"/></svg>
    <b>OUR ACC<br>JOURNEY</b>
  </div>

  <div class="eyebrow">광주에서의 짧은 여행</div>
  <div class="h1"><strong>남은 시간에</strong><br>어떤 여행을 할까요?</div>
  <div class="lead">돌아가는 시간에 맞춰 ACC 코스를 골라 드려요.</div>

  <!-- 기차 시간 -->
  <div class="time">
    <div class="bgimg"></div>
    <div class="k">돌아가는 기차 시간</div>
    <div class="v">17:00</div>
    <div class="hint">시간을 눌러 바꿔요.</div>
    <div class="ctl">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F7F5EF" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15 14"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F7F5EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"/></svg>
    </div>
  </div>

  <!-- 머물 시간 -->
  <div class="label">기차가 아니라면, 머물 시간을 골라요.</div>
  <div class="seg"><button>1시간</button><button>2시간</button><button>반나절</button></div>

  <!-- 동행 -->
  <div class="title">누구와 함께하나요?</div>
  <div class="grid">
    <button class="card on"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>혼자
      <span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"/></svg></span></button>
    <button class="card"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="3"/><circle cx="16" cy="8.5" r="3"/><path d="M2.5 19.5c.9-3 3.2-4.5 6-4.5s5 1.5 6 4.5M14 15.2c.6-.1 1.3-.2 2-.2 2.8 0 5 1.5 6 4.5"/></svg>친구·연인</button>
    <button class="card"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="7" r="3.2"/><circle cx="17.5" cy="12" r="2.2"/><path d="M3 20c.9-3.4 3.2-5.2 6-5.2 1.8 0 3.4.7 4.5 2M14 20c.5-2 1.8-3.2 3.5-3.2S20.5 18 21 20"/></svg>아이와</button>
    <button class="card"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="6.5" cy="8" r="2.6"/><circle cx="12" cy="6.5" r="2.6"/><circle cx="17.5" cy="8" r="2.6"/><path d="M2 19c.6-2.8 2.3-4.3 4.5-4.3M7.5 19.5c.7-3.2 2.4-4.8 4.5-4.8s3.8 1.6 4.5 4.8M17.5 14.7c2.2 0 3.9 1.5 4.5 4.3"/></svg>부모님과</button>
  </div>

  <!-- 코스 받기 -->
  <button class="go">나에게 맞는 코스 받기
    <svg class="arr" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F5EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 H20 M14 6 L20 12 L14 18"/></svg></button>
</div>
</body>
</html>
