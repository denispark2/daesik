<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 코스 화면 시안 (박대식 레이아웃)</title>
<!-- 레이아웃: 박대식이 보낸 시안 이미지(검정·파랑·흰색, 큰 시간 카드, 노선 칸, 내 코스 카드, 아래 메뉴) 그대로.
     전시 칸: ACC 공식 누리집 현재전시 〈인상파, 찬란한 순간들〉 포스터 (https://www.acc.go.kr/main/exhibition.do?PID=0202&action=Read&bnkey=EM_0000009913, 2026-11-19 확인)
       — 기간 2026.9.23.~2027.2.21. · 장소 문화창조원 복합전시 6·7관 · 매표·입장 마감 관람 종료 1시간 전. 포스터 저작권은 ACC·전시 주최 측, 팀 시안 확인용.
     기차 5:00 · 지금 2:00 · 전시 2:10~3:00 · 나갈 시각 3:30은 예시 (상상). 지하철 24분 · 짐 보관 방문자센터 6시는 공식 확인. 관람료는 넣지 않음 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --black:#0B0B0D; --blue:#2B2FDE; --ink:#0B0B0D; --dim:#9A9AA2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#D9DAE0; display:flex; justify-content:center; padding:24px 0;
         font-family:"Noto Sans KR","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  .phone { width:390px; height:844px; background:#fff; color:var(--ink); border-radius:36px; overflow:hidden; position:relative; letter-spacing:-.4px; }

  /* 위쪽 */
  .head { position:absolute; top:44px; left:14px; right:14px; height:52px; display:flex; align-items:center; justify-content:space-between; }
  .logo { width:50px; height:50px; border:2px solid var(--black); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .name { text-align:center; line-height:1.1; }
  .name b { display:block; font-size:16pt; font-weight:900; letter-spacing:-.8px; }
  .name span { font-size:11pt; font-weight:500; }

  /* 큰 시간 카드 */
  .time { position:absolute; top:116px; left:10px; right:10px; height:204px; background:var(--black); color:#fff; border-radius:30px; padding:22px 22px; }
  .time .t1 { font-size:27pt; font-weight:900; line-height:1.1; }
  .time .t2 { font-size:15pt; font-weight:900; margin-top:8px; }
  .time .t3 { font-size:31pt; font-weight:900; line-height:1.05; letter-spacing:-1px; }
  .time .t4 { font-size:11.5pt; font-weight:700; margin-top:10px; }
  .cap3d { position:absolute; top:-22px; right:-6px; }

  /* 노선 칸 */
  .route { position:absolute; top:334px; left:10px; right:10px; display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
  .stop { height:102px; border:2px solid var(--black); border-radius:30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
          font-size:10.5pt; font-weight:700; }
  .stop.past { color:var(--dim); border-color:#2A2A30; }
  .stop.past svg { stroke:var(--dim); }
  .stop.now { background:var(--blue); border-color:var(--blue); color:#fff; }
  .stop.now svg { stroke:#fff; }

  .sec { position:absolute; top:452px; left:14px; font-size:19pt; font-weight:900; }

  /* 내 코스 */
  .ex { position:absolute; top:496px; left:10px; width:194px; height:266px; background:var(--blue); border-radius:24px; overflow:hidden; color:#fff; }
  .ex img { position:absolute; top:0; left:0; width:194px; height:162px; object-fit:cover; object-position:center top; }
  .ex .tag { position:absolute; top:auto; bottom:110px; left:10px; background:var(--blue); color:#fff; font-size:10pt; font-weight:900; padding:3px 10px; border-radius:999px; }
  .ex .info { position:absolute; left:14px; right:12px; top:170px; }
  .ex .where { font-size:9.5pt; font-weight:500; opacity:.9; }
  .ex .when { font-size:21pt; font-weight:900; line-height:1.15; letter-spacing:-.6px; }
  .ex .rev { font-size:10.5pt; font-weight:500; margin-top:2px; line-height:1.35; }

  .out { position:absolute; top:496px; left:212px; right:10px; height:138px; background:var(--black); color:#fff; border-radius:24px; padding:14px 16px; }
  .out .k { font-size:12pt; font-weight:900; }
  .out .v { font-size:36pt; font-weight:900; line-height:1.05; letter-spacing:-1px; }
  .out .s { font-size:10pt; font-weight:500; margin-top:4px; line-height:1.35; }

  .bag { position:absolute; top:642px; left:212px; right:10px; height:120px; border:2px solid var(--black); border-radius:24px; padding:14px 14px;
         display:flex; flex-direction:column; justify-content:center; gap:8px; }
  .bag .k { display:flex; align-items:center; gap:8px; font-size:15pt; font-weight:900; }
  .bag .chip { align-self:flex-start; border:2px solid var(--black); border-radius:999px; padding:2px 10px; font-size:9.5pt; font-weight:700; }

  /* 아래 메뉴 */
  .nav { position:absolute; left:10px; right:10px; bottom:14px; height:62px; background:var(--black); border-radius:999px; display:flex; align-items:center; justify-content:space-around; }
  .nav .on { width:52px; height:52px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="phone">
  <!-- 위쪽: 모자 로고 · 이름 · 날짜 · 찾기 -->
  <div class="head">
    <div class="logo"><svg width="28" height="22" viewBox="0 0 28 22" fill="none" stroke="#0B0B0D" stroke-width="2" stroke-linejoin="round"><path d="M3 11 Q2 3 14 2 Q26 3 25 11 Z"/><path d="M3 11 H25 V14 H3 Z"/><path d="M3 14 Q14 20 25 14"/><circle cx="14" cy="6.5" r="1.6" fill="#0B0B0D"/></svg></div>
    <div class="name"><b>OUR ACC JOURNEY</b><span>오늘 11월 19일</span></div>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
  </div>

  <!-- 큰 시간 카드 -->
  <div class="time">
    <div class="t1">기차 5:00</div>
    <div class="t2">남은 시간</div>
    <div class="t3">1시간 30분</div>
    <div class="t4">3시 반에는 나가요.</div>
    <!-- 흰 역무원 모자 (입체 느낌, 새로 그림) -->
    <svg class="cap3d" width="170" height="130" viewBox="0 0 170 130">
      <defs>
        <radialGradient id="cw" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#ECECEF"/><stop offset="1" stop-color="#B9BAC2"/></radialGradient>
        <linearGradient id="vw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CAD1"/></linearGradient>
        <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A30"/><stop offset="1" stop-color="#050506"/></linearGradient>
        <radialGradient id="btn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C8C9D0"/></radialGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="-4" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
      </defs>
      <g filter="url(#sh)" transform="rotate(-10 85 65)">
        <path d="M18 58 Q10 18 70 12 Q140 6 158 40 Q164 62 140 70 Q90 80 30 74 Q16 70 18 58 Z" fill="url(#cw)"/>
        <path d="M30 66 Q92 80 146 64 L144 88 Q90 102 34 92 Z" fill="url(#bk)"/>
        <path d="M32 92 Q90 104 144 88 Q130 116 74 120 Q30 120 20 104 Q24 96 32 92 Z" fill="url(#vw)"/>
        <path d="M44 106 Q80 112 118 102" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <circle cx="96" cy="76" r="11" fill="url(#btn)"/>
        <path d="M40 34 Q70 18 110 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
      </g>
    </svg>
  </div>

  <!-- 노선 칸: 지난 곳은 흐리게, 지금은 파랑 -->
  <div class="route">
    <div class="stop past"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10 H19 M9 14 h.01 M15 14 h.01 M8 21 l2-4 M16 21 l-2-4"/></svg>송정역</div>
    <div class="stop past"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10 H19 M9 14 h.01 M15 14 h.01 M8 21 l2-4 M16 21 l-2-4"/></svg>지하철</div>
    <div class="stop past"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 V11 L12 6 L20 11 V20 Z M10 20 v-5 h4 v5 M12 6 V2 l4 1.5 L12 5"/></svg>전당역</div>
    <div class="stop now"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17 l5-5 4 4 3-3 6 6"/></svg>인상파</div>
    <div class="stop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 s-7-6.5-7-12 a7 7 0 0 1 14 0 c0 5.5-7 12-7 12 z"/><circle cx="12" cy="9" r="2.5"/></svg>동네 B</div>
    <div class="stop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10 H19 M9 14 h.01 M15 14 h.01 M8 21 l2-4 M16 21 l-2-4"/></svg>송정역</div>
  </div>

  <div class="sec">내 코스</div>

  <!-- 지금 볼 전시: 실제 포스터 -->
  <div class="ex">
    <img src="screen-draft-poster.jpg" alt="인상파, 찬란한 순간들 포스터">
    <div class="tag">지금</div>
    <div class="info">
      <div class="where">문화창조원 복합전시 6·7관</div>
      <div class="when">2:10–3:00</div>
      <div class="rev">좋았다는 후기가 있어요.</div>
    </div>
  </div>

  <!-- 나갈 시각 -->
  <div class="out">
    <div class="k">나갈 시각</div>
    <div class="v">3:30</div>
    <div class="s">송정역까지 지하철로<br>24분이에요.</div>
  </div>

  <!-- 짐 보관 -->
  <div class="bag">
    <div class="k"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7 V4 h6 v3 M7 7 v13 M17 7 v13"/></svg>짐 보관</div>
    <div class="chip">방문자센터 · 6시까지</div>
  </div>

  <!-- 아래 메뉴 -->
  <div class="nav">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"/></svg>
    <div class="on"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="16" r="2.6"/><circle cx="18" cy="8" r="2.6"/><path d="M8.2 14.4 L15.8 9.6"/></svg></div>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3 L3 10.5 L11 13 L13.5 21 Z"/></svg>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M6 17 V11 a6 6 0 0 1 12 0 V17 l1.5 2 h-15 Z M10 21 h4"/></svg>
  </div>
</div>
</body>
</html>
