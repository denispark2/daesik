<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 첫 화면 시안 (Google Arts &amp; Culture 느낌)</title>
<!-- 참고: 구글 플레이 'Google Arts & Culture' 앱 스크린샷 (2026-11-19 확인) — 흰 위쪽 바와 가는 회색 글씨, 작품 사진을 화면 끝까지 크게, 흰 바탕·가는 회색 구분선, 모서리 작은(4~8px) 테두리 버튼, 옅은 그림자 카드, 고리 두른 동그라미 사진.
     위쪽 사진: ACC 길라잡이 앱 구글 플레이 스크린샷(전당 투어 화면)에서 잘라 씀 — 저작권 국립아시아문화전당, 팀 시안 확인용. 역무원은 모자만 새로 그림. 화면 글은 팀 brand/service-prompt.md 그대로 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#202124; --sub:#5F6368; --line:#DADCE0; --soft:#F1F3F4; --orange:#E8792B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#E8EAED; display:flex; justify-content:center; padding:24px 0;
         font-family:"Roboto","Noto Sans KR","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  .phone { width:390px; height:844px; background:#fff; color:var(--ink); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; }

  /* 위쪽 바: 흰 바탕, 가는 회색 글씨, 아래 가는 선 */
  .bar { padding:48px 20px 14px; font-size:14pt; font-weight:400; color:#3C4043; letter-spacing:.4px; border-bottom:1px solid var(--line); text-align:center; }
  .bar b { font-weight:500; color:var(--ink); }

  /* 사진: 화면 끝까지, 덮개 없이 */
  .hero { position:relative; height:196px; flex:0 0 auto; }
  .hero img { position:absolute; inset:0; width:390px; height:196px; object-fit:cover; }

  /* 역무원 모자: 고리 두른 동그라미 */
  .who { position:absolute; left:16px; bottom:-40px; width:88px; height:88px; border-radius:50%; background:#fff;
         display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15); }
  .who::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:3px solid var(--orange); border-left-color:transparent; border-bottom-color:transparent; transform:rotate(-20deg); }
  /* 말풍선: 옅은 그림자 카드 */
  .bubble { position:absolute; right:16px; bottom:-34px; width:250px; background:#fff; border-radius:8px; padding:14px 18px;
            font-family:"Noto Sans KR",sans-serif; font-size:16pt; font-weight:500; line-height:1.4; letter-spacing:-.3px; word-break:keep-all;
            box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15); }

  .guide { font-family:"Noto Sans KR",sans-serif; font-size:12.5pt; font-weight:300; color:var(--sub); line-height:1.6; padding:50px 20px 0; word-break:keep-all; }

  /* 시간: 가운데 줄 위아래 가는 선 */
  .wheel { position:relative; margin:8px 20px 0; height:108px; display:flex; justify-content:center; align-items:center; gap:80px; }
  .wheel::before, .wheel::after { content:""; position:absolute; left:0; right:0; height:1px; background:var(--line); }
  .wheel::before { top:24px; } .wheel::after { bottom:24px; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .col span { font-family:"Roboto",sans-serif; font-size:12pt; font-weight:300; color:#BDC1C6; line-height:1.4; }
  .col span.sel { font-size:40pt; font-weight:400; color:var(--orange); line-height:1.15; }

  .label { font-family:"Noto Sans KR",sans-serif; font-size:10.5pt; font-weight:400; color:var(--sub); padding:4px 20px 8px; }
  /* 머물 시간: 모서리 작은 테두리 버튼 */
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 20px; }
  .ob { height:44px; border:1px solid var(--line); border-radius:4px; background:#fff; font-family:"Noto Sans KR",sans-serif; font-size:13.5pt; font-weight:400; color:#3C4043; }

  .title { font-family:"Noto Sans KR",sans-serif; font-size:14pt; font-weight:500; padding:12px 20px 8px; color:var(--ink); }
  /* 동행: 옅은 그림자 카드, 위에 선 아이콘 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 20px; }
  .card { height:52px; border:0; border-radius:8px; background:#fff; display:flex; align-items:center; gap:12px; padding:0 16px;
          font-family:"Noto Sans KR",sans-serif; font-size:14pt; font-weight:400; color:var(--ink);
          box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15); }
  .foot { margin-top:auto; padding:0 20px 22px; }
  .go { width:100%; height:52px; border:0; border-radius:4px; background:rgba(60,64,67,.12); color:rgba(60,64,67,.5);
        font-family:"Noto Sans KR",sans-serif; font-size:15pt; font-weight:500; letter-spacing:.5px; }
</style>
</head>
<body>
<div class="phone">
  <!-- ① 이름 · 사진 · 모자 · 말풍선 · 안내 한 줄 -->
  <div class="bar"><b>OUR</b> ACC JOURNEY</div>
  <div class="hero">
    <img src="screen-draft-hero.jpg" alt="">
    <div class="who">
      <svg width="70" height="54" viewBox="0 0 184 140" stroke-linejoin="round">
        <defs>
          <radialGradient id="crown" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#4A5490"/><stop offset=".55" stop-color="#2B3366"/><stop offset="1" stop-color="#161B3A"/></radialGradient>
          <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2448"/><stop offset="1" stop-color="#0F1330"/></linearGradient>
          <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3D48"/><stop offset=".35" stop-color="#121318"/><stop offset="1" stop-color="#000"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3"/><stop offset=".5" stop-color="#D9A83E"/><stop offset="1" stop-color="#8F6A1E"/></linearGradient>
          <radialGradient id="emb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF1C2"/><stop offset=".6" stop-color="#D9A83E"/><stop offset="1" stop-color="#7E5A16"/></radialGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
        </defs>
        <g filter="url(#soft)">
          <!-- 크라운 (위가 넓은 천) -->
          <path d="M14 62 Q8 30 52 20 Q92 10 132 20 Q178 30 170 62 Q150 74 92 76 Q34 74 14 62 Z" fill="url(#crown)"/>
          <path d="M30 40 Q80 22 150 36" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
          <path d="M92 18 Q90 46 92 70" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
          <!-- 띠 -->
          <path d="M30 66 Q92 80 154 66 L152 92 Q92 104 32 92 Z" fill="url(#band)"/>
          <!-- 금색 끈 -->
          <path d="M34 88 Q92 100 150 88" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="36" cy="88" r="4.5" fill="url(#gold)"/><circle cx="148" cy="88" r="4.5" fill="url(#gold)"/>
          <!-- 챙 (광택) -->
          <path d="M30 92 Q92 108 154 92 Q150 118 92 128 Q34 118 30 92 Z" fill="url(#visor)"/>
          <path d="M52 104 Q92 114 132 104" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
          <!-- 휘장 -->
          <path d="M70 52 Q80 44 92 50 Q104 44 114 52 Q104 56 92 54 Q80 56 70 52 Z" fill="url(#gold)"/>
          <circle cx="92" cy="52" r="11" fill="url(#emb)" stroke="#7E5A16" stroke-width="1.5"/>
          <circle cx="92" cy="52" r="4.5" fill="#E8792B"/>
        </g>
      </svg>
    </div>
    <div class="bubble">돌아가는 기차가<br>몇 시예요?</div>
  </div>
  <div class="guide">남은 시간만 알려 주세요.<br>그 안에 볼 것을 골라 드려요.</div>

  <!-- ② 남은 시간 -->
  <div class="wheel">
    <div class="col"><span>4</span><span class="sel">5</span><span>6</span></div>
    <div class="col"><span>50</span><span class="sel">00</span><span>10</span></div>
  </div>
  <div class="label">기차가 아니면</div>
  <div class="row3"><button class="ob">1시간</button><button class="ob">2시간</button><button class="ob">반나절</button></div>

  <!-- ③ 동행 -->
  <div class="title">누구와 왔어요?</div>
  <div class="grid">
    <button class="card"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>혼자</button>
    <button class="card"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="3"/><circle cx="16" cy="8.5" r="3"/><path d="M2.5 19.5c.9-3 3.2-4.5 6-4.5s5 1.5 6 4.5M14 15.2c.6-.1 1.3-.2 2-.2 2.8 0 5 1.5 6 4.5"/></svg>친구·연인</button>
    <button class="card"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="7" r="3.2"/><circle cx="17.5" cy="12" r="2.2"/><path d="M3 20c.9-3.4 3.2-5.2 6-5.2 1.8 0 3.4.7 4.5 2M14 20c.5-2 1.8-3.2 3.5-3.2S20.5 18 21 20"/></svg>아이와</button>
    <button class="card"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round"><circle cx="6.5" cy="8" r="2.6"/><circle cx="12" cy="6.5" r="2.6"/><circle cx="17.5" cy="8" r="2.6"/><path d="M2 19c.6-2.8 2.3-4.3 4.5-4.3M7.5 19.5c.7-3.2 2.4-4.8 4.5-4.8s3.8 1.6 4.5 4.8M17.5 14.7c2.2 0 3.900 1.5 4.5 4.3"/></svg>부모님과</button>
  </div>

  <!-- ④ 코스 받기 (고르기 전, 비활성) -->
  <div class="foot"><button class="go">코스 받기</button></div>
</div>
</body>
</html>
