<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 첫 화면 시안 (ACC 길라잡이 앱 느낌)</title>
<!-- 참고: 구글 플레이 'ACC 길라잡이(ACC Guide)' 앱 스크린샷 (2026-11-19 확인) — 짙은 남보라 위쪽 바(#313868), 밤의 ACC 사진을 크게 쓴 첫 화면, 흰 바탕, 가는 선 아이콘, 연한 회색 둥근 버튼.
     첫 화면 사진은 ACC 길라잡이 앱 구글 플레이 스크린샷(전당 투어 화면)에서 잘라 씀 — 저작권: 국립아시아문화전당, 팀 시안 확인용. 역무원은 모자만 실사 느낌으로 새로 그림. 화면 글은 팀 brand/service-prompt.md 그대로 -->
<style>
  :root { --indigo:#313868; --indigo2:#232A56; --ink:#1F2233; --sub:#6B6F80; --line:#DADCE6; --soft:#F4F5F9; --orange:#E8792B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1B1F3A; display:flex; justify-content:center; padding:24px 0;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .phone { width:390px; height:844px; background:#FFFFFF; color:var(--ink); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; }

  .bar { background:var(--indigo2); color:#fff; padding:48px 20px 12px; font-size:15pt; font-weight:800; letter-spacing:.6px; }
  .hero { position:relative; height:196px; flex:0 0 auto; }
  .hero img.scene { position:absolute; inset:0; width:390px; height:196px; object-fit:cover; }
  .hero .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(35,42,86,.35) 0%,rgba(35,42,86,0) 35%,rgba(20,24,56,.55) 100%); }
  .hero .who { position:absolute; left:16px; bottom:-34px; width:104px; height:104px; border-radius:50%; background:#fff;
               display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(20,24,60,.22); }
  .hero .bubble { position:absolute; right:16px; bottom:-30px; width:232px; background:#fff; border-radius:16px; padding:12px 16px;
                  font-size:18pt; font-weight:800; line-height:1.3; word-break:keep-all; box-shadow:0 6px 16px rgba(20,24,60,.18); }
  .hero .bubble::before { content:""; position:absolute; left:-8px; bottom:18px; border:8px solid transparent; border-right-color:#fff; border-left:0; }

  .guide { font-size:14pt; color:var(--sub); line-height:1.45; padding:40px 20px 0; word-break:keep-all; }
  .wheel { margin:12px 16px 0; background:var(--soft); border:1px solid var(--line); border-radius:16px; display:flex; justify-content:center; gap:64px; padding:2px 0; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .col span { font-size:15pt; color:#A4A8B6; line-height:1.3; }
  .col span.sel { font-size:42pt; font-weight:800; color:var(--orange); line-height:1.1; }

  .label { font-size:14pt; color:var(--sub); padding:10px 20px 6px; }
  .grid { display:grid; gap:8px; padding:0 16px; }
  .grid.three { grid-template-columns:1fr 1fr 1fr; }
  .grid.two { grid-template-columns:1fr 1fr; }
  .btn { height:50px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:16pt; font-family:inherit; }
  .title { font-size:17pt; font-weight:800; padding:12px 20px 8px; color:var(--indigo2); }
  .foot { margin-top:auto; padding:0 16px 22px; }
  .go { width:100%; height:56px; border:0; border-radius:12px; background:rgba(49,56,104,.45); color:#fff; font-size:18pt; font-weight:800; font-family:inherit; }
</style>
</head>
<body>
<div class="phone">
  <!-- ① 이름 -->
  <div class="bar">OUR ACC JOURNEY</div>

  <!-- 첫 화면 그림: 밤의 ACC (상상) — 1번 게이트 건물(가운데 큰 통로) · 시계탑 · 땅 아래 광장 불빛 · 채광창 -->
  <div class="hero">
    <img class="scene" src="screen-draft-hero.jpg" alt="">
    <div class="shade"></div>

    <div class="who">
      <!-- 역무원 모자 (실사 느낌, 새로 그림): 남색 천 크라운 · 검은 광택 챙 · 금색 끈 · 휘장 -->
      <svg width="92" height="70" viewBox="0 0 184 140" stroke-linejoin="round">
        <defs>
          <radialGradient id="crown" cx=".45" cy=".3" r=".8"><stop offset="0" stop-color="#4A5490"/><stop offset=".55" stop-color="#2B3366"/><stop offset="1" stop-color="#161B3A"/></radialGradient>
          <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2448"/><stop offset="1" stop-color="#0F1330"/></linearGradient>
          <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3D48"/><stop offset=".35" stop-color="#121318"/><stop offset="1" stop-color="#000"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3"/><stop offset=".5" stop-color="#D9A83E"/><stop offset="1" stop-color="#8F6A1E"/></linearGradient>
          <radialGradient id="emb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF1C2"/><stop offset=".6" stop-color="#D9A83E"/><stop offset="1" stop-color="#7E5A16"/></radialGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
        </defs>
        <g filter="url(#soft)">
          <!-- 크라운 (위가 넓은 천) -->
          <path d="M14 62 Q8 30 52 20 Q92 10 132 20 Q178 30 170 62 Q150 74 92 76 Q34 74 14 62 Z" fill="url(#crown)"/>
          <path d="M30 40 Q80 22 150 36" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
          <path d="M92 18 Q90 46 92 70" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
          <!-- 띠 -->
          <path d="M30 66 Q92 80 154 66 L152 92 Q92 104 32 92 Z" fill="url(#band)"/>
          <!-- 금색 끈 -->
          <path d="M34 88 Q92 100 150 88" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="36" cy="88" r="4.5" fill="url(#gold)"/><circle cx="148" cy="88" r="4.5" fill="url(#gold)"/>
          <!-- 챙 (광택) -->
          <path d="M30 92 Q92 108 154 92 Q150 118 92 128 Q34 118 30 92 Z" fill="url(#visor)"/>
          <path d="M52 104 Q92 114 132 104" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
          <!-- 휘장 -->
          <path d="M70 52 Q80 44 92 50 Q104 44 114 52 Q104 56 92 54 Q80 56 70 52 Z" fill="url(#gold)"/>
          <circle cx="92" cy="52" r="11" fill="url(#emb)" stroke="#7E5A16" stroke-width="1.5"/>
          <circle cx="92" cy="52" r="4.5" fill="#E8792B"/>
        </g>
      </svg>
    </div>

    <div class="bubble">돌아가는 기차가<br>몇 시예요?</div>
  </div>

  <div class="guide">남은 시간만 알려 주세요.<br>그 안에 볼 것을 골라 드려요.</div>

  <!-- ② 남은 시간 -->
  <div class="wheel">
    <div class="col"><span>4</span><span class="sel">5</span><span>6</span></div>
    <div class="col"><span>50</span><span class="sel">00</span><span>10</span></div>
  </div>
  <div class="label">기차가 아니면</div>
  <div class="grid three"><button class="btn">1시간</button><button class="btn">2시간</button><button class="btn">반나절</button></div>

  <!-- ③ 동행 -->
  <div class="title">누구와 왔어요?</div>
  <div class="grid two">
    <button class="btn">혼자</button><button class="btn">친구·연인</button>
    <button class="btn">아이와</button><button class="btn">부모님과</button>
  </div>

  <!-- ④ 코스 받기 (고르기 전, 흐리게) -->
  <div class="foot"><button class="go">코스 받기</button></div>
</div>
</body>
</html>
