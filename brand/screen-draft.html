<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 첫 화면 시안 (ACC 길라잡이 앱 느낌)</title>
<!-- 참고: 구글 플레이 'ACC 길라잡이(ACC Guide)' 앱 스크린샷 (2026-11-19 확인) — 짙은 남보라 위쪽 바(#313868), 밤의 ACC 사진을 크게 쓴 첫 화면, 흰 바탕, 가는 선 아이콘, 연한 회색 둥근 버튼.
     사진은 쓰지 않고 밤의 ACC를 새로 그림 (상상). 화면 글은 팀 brand/service-prompt.md 그대로 -->
<style>
  :root { --indigo:#313868; --indigo2:#232A56; --ink:#1F2233; --sub:#6B6F80; --line:#DADCE6; --soft:#F4F5F9; --orange:#E8792B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1B1F3A; display:flex; justify-content:center; padding:24px 0;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .phone { width:390px; height:844px; background:#FFFFFF; color:var(--ink); border-radius:36px; overflow:hidden; display:flex; flex-direction:column; }

  .bar { background:var(--indigo2); color:#fff; padding:48px 20px 12px; font-size:15pt; font-weight:800; letter-spacing:.6px; }
  .hero { position:relative; height:196px; flex:0 0 auto; }
  .hero svg.scene { position:absolute; inset:0; width:390px; height:196px; }
  .hero .who { position:absolute; left:14px; bottom:-26px; }
  .hero .bubble { position:absolute; right:16px; bottom:-30px; width:232px; background:#fff; border-radius:16px; padding:12px 16px;
                  font-size:18pt; font-weight:800; line-height:1.3; word-break:keep-all; box-shadow:0 6px 16px rgba(20,24,60,.18); }
  .hero .bubble::before { content:""; position:absolute; left:-8px; bottom:18px; border:8px solid transparent; border-right-color:#fff; border-left:0; }

  .guide { font-size:14pt; color:var(--sub); line-height:1.45; padding:40px 20px 0; word-break:keep-all; }
  .wheel { margin:12px 16px 0; background:var(--soft); border:1px solid var(--line); border-radius:16px; display:flex; justify-content:center; gap:64px; padding:2px 0; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .col span { font-size:15pt; color:#A4A8B6; line-height:1.3; }
  .col span.sel { font-size:42pt; font-weight:800; color:var(--orange); line-height:1.1; }

  .label { font-size:14pt; color:var(--sub); padding:10px 20px 6px; }
  .grid { display:grid; gap:8px; padding:0 16px; }
  .grid.three { grid-template-columns:1fr 1fr 1fr; }
  .grid.two { grid-template-columns:1fr 1fr; }
  .btn { height:50px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:16pt; font-family:inherit; }
  .title { font-size:17pt; font-weight:800; padding:12px 20px 8px; color:var(--indigo2); }
  .foot { margin-top:auto; padding:0 16px 22px; }
  .go { width:100%; height:56px; border:0; border-radius:12px; background:rgba(49,56,104,.45); color:#fff; font-size:18pt; font-weight:800; font-family:inherit; }
</style>
</head>
<body>
<div class="phone">
  <!-- ① 이름 -->
  <div class="bar">OUR ACC JOURNEY</div>

  <!-- 첫 화면 그림: 밤의 ACC (상상) — 1번 게이트 건물(가운데 큰 통로) · 시계탑 · 땅 아래 광장 불빛 · 채광창 -->
  <div class="hero">
    <svg class="scene" viewBox="0 0 390 196" aria-hidden="true">
      <defs>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232A56"/><stop offset=".6" stop-color="#3E4A86"/><stop offset="1" stop-color="#7C7FB0"/></linearGradient>
        <linearGradient id="plaza" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2F52"/><stop offset="1" stop-color="#151935"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".8"/><stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="390" height="196" fill="url(#night)"/>
      <!-- 별 · 달 -->
      <g fill="#fff"><circle cx="40" cy="22" r="1.2"/><circle cx="120" cy="14" r="1"/><circle cx="196" cy="30" r="1.3"/><circle cx="260" cy="12" r="1"/><circle cx="90" cy="48" r="0.9"/><circle cx="352" cy="40" r="1.1"/></g>
      <circle cx="330" cy="30" r="11" fill="#F6EFD8"/><circle cx="335" cy="27" r="10" fill="#2E3770"/>
      <!-- 먼 도시 -->
      <g fill="#2B3260" opacity=".9">
        <rect x="0" y="92" width="26" height="40"/><rect x="28" y="80" width="18" height="52"/><rect x="48" y="98" width="30" height="34"/><rect x="300" y="86" width="22" height="46"/><rect x="326" y="96" width="34" height="36"/><rect x="362" y="78" width="28" height="54"/>
      </g>
      <g fill="#FFD9A0" opacity=".55"><rect x="32" y="88" width="3" height="3"/><rect x="38" y="100" width="3" height="3"/><rect x="306" y="94" width="3" height="3"/><rect x="368" y="90" width="3" height="3"/><rect x="374" y="104" width="3" height="3"/></g>
      <!-- 1번 게이트 건물 -->
      <g transform="translate(120 70)">
        <rect x="0" y="12" width="170" height="64" fill="#E9E6F2"/>
        <rect x="58" y="2" width="54" height="11" fill="#E9E6F2"/>
        <g fill="#FFD48A">
          <rect x="8" y="20" width="12" height="9"/><rect x="25" y="20" width="12" height="9"/><rect x="42" y="20" width="12" height="9"/><rect x="59" y="20" width="12" height="9"/><rect x="99" y="20" width="12" height="9"/><rect x="116" y="20" width="12" height="9"/><rect x="133" y="20" width="12" height="9"/><rect x="150" y="20" width="12" height="9"/>
          <rect x="8" y="36" width="12" height="9"/><rect x="25" y="36" width="12" height="9"/><rect x="133" y="36" width="12" height="9"/><rect x="150" y="36" width="12" height="9"/>
          <rect x="8" y="52" width="12" height="9"/><rect x="25" y="52" width="12" height="9"/><rect x="133" y="52" width="12" height="9"/><rect x="150" y="52" width="12" height="9"/>
        </g>
        <g fill="#B8B6CF"><rect x="42" y="36" width="12" height="9"/><rect x="116" y="36" width="12" height="9"/><rect x="42" y="52" width="12" height="9"/><rect x="116" y="52" width="12" height="9"/><rect x="76" y="20" width="18" height="9"/></g>
        <rect x="58" y="38" width="54" height="38" fill="#1E2346"/>
        <rect x="58" y="38" width="54" height="38" fill="url(#glow)"/>
      </g>
      <!-- 시계탑 -->
      <g transform="translate(92 52)">
        <rect x="0" y="12" width="14" height="82" fill="#E9E6F2"/>
        <path d="M-2 13 L7 0 L16 13 Z" fill="#C9C6DD"/>
        <circle cx="7" cy="26" r="5" fill="#FFF3D6" stroke="#8A88AE" stroke-width="1.5"/>
      </g>
      <!-- 땅 · 광장 -->
      <rect x="0" y="146" width="390" height="50" fill="url(#plaza)"/>
      <path d="M0 146 H390" stroke="#8C90C0" stroke-width="1" opacity=".6"/>
      <!-- 채광창 불빛 -->
      <g fill="#FFE1A8"><rect x="300" y="138" width="20" height="8" rx="1"/><rect x="330" y="134" width="26" height="12" rx="1"/><rect x="364" y="140" width="16" height="6" rx="1"/></g>
      <g fill="url(#glow)"><circle cx="343" cy="140" r="26"/><circle cx="310" cy="142" r="18"/></g>
      <!-- 바닥 조명 줄 -->
      <g fill="#FFE1A8" opacity=".9"><circle cx="20" cy="160" r="1.5"/><circle cx="60" cy="160" r="1.5"/><circle cx="100" cy="160" r="1.5"/><circle cx="140" cy="160" r="1.5"/><circle cx="180" cy="160" r="1.5"/><circle cx="220" cy="160" r="1.5"/><circle cx="260" cy="160" r="1.5"/></g>
    </svg>

    <!-- ACC 역무원 (상상): 남보라 모자·제복, 깔끔한 선, 회중시계 -->
    <svg class="who" width="104" height="124" viewBox="0 0 104 124" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="52" cy="120" rx="34" ry="4" fill="#000" opacity=".12"/>
      <!-- 몸 -->
      <path d="M22 118 Q20 84 52 80 Q84 84 82 118 Z" fill="#313868" stroke="#1B1F3A" stroke-width="2"/>
      <path d="M42 81 L52 95 L62 81 Z" fill="#fff" stroke="#1B1F3A" stroke-width="1.6"/>
      <path d="M50 87 H54 L55.5 101 L52 105 L48.5 101 Z" fill="#E8792B" stroke="#1B1F3A" stroke-width="1.2"/>
      <circle cx="64" cy="104" r="1.8" fill="#E9E6F2"/><circle cx="64" cy="112" r="1.8" fill="#E9E6F2"/>
      <!-- 회중시계 -->
      <path d="M68 98 Q76 94 80 98" fill="none" stroke="#E8792B" stroke-width="1.6"/>
      <circle cx="86" cy="100" r="10" fill="#fff" stroke="#1B1F3A" stroke-width="2"/>
      <path d="M86 100 V94.5 M86 100 L89.5 102" stroke="#E8792B" stroke-width="2"/>
      <circle cx="90" cy="108" r="6" fill="#FFE2C8" stroke="#1B1F3A" stroke-width="1.8"/>
      <!-- 얼굴 -->
      <ellipse cx="52" cy="54" rx="28" ry="26" fill="#FFE2C8" stroke="#1B1F3A" stroke-width="2.2"/>
      <path d="M26 46 Q30 52 34 46 Q38 52 42 46 M62 46 Q66 52 70 46 Q74 52 78 46" fill="#3A2A22" stroke="#3A2A22" stroke-width="2"/>
      <ellipse cx="42" cy="57" rx="3" ry="3.8" fill="#1B1F3A"/><ellipse cx="62" cy="57" rx="3" ry="3.8" fill="#1B1F3A"/>
      <circle cx="43" cy="55.6" r="1" fill="#fff"/><circle cx="63" cy="55.6" r="1" fill="#fff"/>
      <ellipse cx="34" cy="65" rx="5" ry="3" fill="#F39C8B" opacity=".5"/><ellipse cx="70" cy="65" rx="5" ry="3" fill="#F39C8B" opacity=".5"/>
      <path d="M47 66 Q52 70 57 66" fill="none" stroke="#1B1F3A" stroke-width="2"/>
      <!-- 역무원 모자 -->
      <path d="M24 40 Q22 14 52 12 Q82 14 80 40 Z" fill="#313868" stroke="#1B1F3A" stroke-width="2"/>
      <rect x="24" y="33" width="56" height="7" fill="#232A56"/>
      <path d="M24 35 H80" stroke="#E8792B" stroke-width="1.8"/>
      <path d="M22 40 Q52 49 82 40 L79 45 Q52 54 25 45 Z" fill="#1B1F3A"/>
      <circle cx="52" cy="23" r="5" fill="#E8792B" stroke="#1B1F3A" stroke-width="1.4"/>
      <path d="M34 20 Q42 15 50 15" fill="none" stroke="#fff" stroke-width="1.6" opacity=".4"/>
    </svg>

    <div class="bubble">돌아가는 기차가<br>몇 시예요?</div>
  </div>

  <div class="guide">남은 시간만 알려 주세요.<br>그 안에 볼 것을 골라 드려요.</div>

  <!-- ② 남은 시간 -->
  <div class="wheel">
    <div class="col"><span>4</span><span class="sel">5</span><span>6</span></div>
    <div class="col"><span>50</span><span class="sel">00</span><span>10</span></div>
  </div>
  <div class="label">기차가 아니면</div>
  <div class="grid three"><button class="btn">1시간</button><button class="btn">2시간</button><button class="btn">반나절</button></div>

  <!-- ③ 동행 -->
  <div class="title">누구와 왔어요?</div>
  <div class="grid two">
    <button class="btn">혼자</button><button class="btn">친구·연인</button>
    <button class="btn">아이와</button><button class="btn">부모님과</button>
  </div>

  <!-- ④ 코스 받기 (고르기 전, 흐리게) -->
  <div class="foot"><button class="go">코스 받기</button></div>
</div>
</body>
</html>
