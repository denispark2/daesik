<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUR ACC JOURNEY — 첫 화면 시안 (팀 brand/service-prompt.md)</title>
<style>
  :root { --navy:#1F2A44; --cream:#F5F1E8; --orange:#E8792B; --dim:rgba(31,42,68,.5); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--navy); display:flex; justify-content:center; padding:24px 0;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .phone { width:390px; height:844px; background:var(--cream); color:var(--navy); border-radius:36px; overflow:hidden;
           display:flex; flex-direction:column; }
  /* ① 이름 바 */
  .bar { background:var(--navy); color:var(--cream); padding:46px 20px 0; font-size:16pt; font-weight:800; letter-spacing:.5px; }
  .head { display:flex; gap:10px; align-items:center; padding:8px 20px 0; }  .scene { display:block; width:390px; height:84px; margin:6px -20px 0; }
  .bubble { border:2px solid var(--navy); border-radius:16px 16px 16px 4px; padding:10px 14px; font-size:20pt; word-break:keep-all; font-weight:700; line-height:1.3; }
  .guide { font-size:16pt; word-break:keep-all; line-height:1.4; padding:6px 20px 0; }
  /* ② 남은 시간 */
  .wheel { margin:10px 20px 0; border:2px solid var(--navy); border-radius:16px; display:flex; justify-content:center; align-items:center; gap:56px; padding:4px 0; }
  .col { display:flex; flex-direction:column; align-items:center; }
  .col span { font-size:16pt; color:var(--dim); line-height:1.35; }
  .col span.sel { font-size:42pt; font-weight:800; color:var(--orange); line-height:1.1; }
  .label { font-size:16pt; color:var(--dim); padding:8px 20px 4px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 20px; }
  .chip { height:52px; border:2px solid var(--navy); border-radius:12px; background:var(--cream); color:var(--navy);
          font-size:18pt; font-family:inherit; }
  /* ③ 동행 */
  .title { font-size:20pt; font-weight:700; padding:10px 20px 6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 20px; }
  /* ④ 코스 받기 */
  .foot { margin-top:auto; padding:0 20px 22px; }
  .go { width:100%; height:58px; border:0; border-radius:14px; background:var(--dim); color:var(--cream);
        font-size:18pt; font-weight:700; font-family:inherit; }
  /* 위쪽 바: ACC 외관 일러스트 */
  .phone { position:relative; }
</style>
</head>
<body>
<div class="phone">

  <!-- ① -->
  <div class="bar">OUR ACC JOURNEY
    <!-- ACC 외관 일러스트 (상상, 글 없음): 1번 게이트 건물(흰 건물·가운데 큰 통로) · 시계탑 · 땅 아래 아시아문화광장 · 지붕 채광창 · 나무 · 해 -->
    <svg class="scene" viewBox="0 0 390 84" aria-hidden="true">
      <circle cx="338" cy="22" r="13" fill="#E8792B"/>
      <!-- 지붕 정원 + 채광창 -->
      <path d="M0 64 H130 M262 64 H390" stroke="#F5F1E8" stroke-opacity=".5" stroke-width="2"/>
      <g fill="none" stroke="#F5F1E8" stroke-opacity=".6" stroke-width="1.6">
        <path d="M16 64 v-10 l9 -5 l9 5 v10"/><path d="M46 64 v-14 l11 -6 l11 6 v14"/><path d="M82 64 v-9 l7 -4 l7 4 v9"/>
      </g>
      <g fill="#E8792B" opacity=".75"><rect x="20" y="56" width="10" height="5"/><rect x="51" y="53" width="12" height="7"/><rect x="85" y="57" width="8" height="4"/></g>
      <!-- 나무 -->
      <g fill="#F5F1E8" opacity=".35"><circle cx="114" cy="46" r="11"/><circle cx="105" cy="52" r="7"/><rect x="112" y="52" width="3" height="12"/></g>
      <!-- 땅 아래 아시아문화광장 -->
      <path d="M130 64 L142 84 M262 64 L250 84" stroke="#F5F1E8" stroke-opacity=".5" stroke-width="2"/>
      <g fill="#F5F1E8" opacity=".35"><rect x="154" y="72" width="8" height="12" rx="1.5"/><rect x="168" y="72" width="8" height="12" rx="1.5"/><rect x="216" y="72" width="8" height="12" rx="1.5"/><rect x="230" y="72" width="8" height="12" rx="1.5"/></g>
      <circle cx="196" cy="76" r="2.6" fill="#E8792B"/><path d="M196 78.5 v5.5" stroke="#E8792B" stroke-width="2"/>
      <!-- 시계탑 -->
      <rect x="270" y="20" width="10" height="44" fill="#F5F1E8" opacity=".9"/>
      <path d="M267 20 L275 10 L283 20 Z" fill="#F5F1E8" opacity=".9"/>
      <circle cx="275" cy="29" r="3.6" fill="#1F2A44"/><circle cx="275" cy="29" r="1.6" fill="#E8792B"/>
      <!-- 1번 게이트 건물 -->
      <rect x="290" y="30" width="96" height="34" fill="#F5F1E8" opacity=".95"/>
      <rect x="322" y="25" width="30" height="5" fill="#F5F1E8" opacity=".95"/>
      <g fill="#1F2A44" opacity=".55">
        <rect x="295" y="34" width="7" height="6"/><rect x="306" y="34" width="7" height="6"/><rect x="317" y="34" width="7" height="6"/><rect x="328" y="34" width="7" height="6"/><rect x="339" y="34" width="7" height="6"/><rect x="350" y="34" width="7" height="6"/><rect x="361" y="34" width="7" height="6"/><rect x="372" y="34" width="7" height="6"/>
        <rect x="295" y="44" width="7" height="6"/><rect x="306" y="44" width="7" height="6"/><rect x="361" y="44" width="7" height="6"/><rect x="372" y="44" width="7" height="6"/>
        <rect x="295" y="54" width="7" height="6"/><rect x="306" y="54" width="7" height="6"/><rect x="361" y="54" width="7" height="6"/><rect x="372" y="54" width="7" height="6"/>
      </g>
      <rect x="320" y="44" width="34" height="20" fill="#1F2A44"/>
    </svg>
  </div>
  <div class="head">
    <!-- ACC 역무원 캐릭터 (상상, 만화풍 2등신): 큰 역무원 모자 · 큰 눈 · 손 흔들기 · 회중시계(꼼꼼하게 시간부터 계산) -->
    <svg width="112" height="124" viewBox="0 0 112 124" style="flex:0 0 auto" stroke-linejoin="round" stroke-linecap="round">
      <!-- 흔드는 팔 -->
      <path d="M78 104 Q90 96 94 80" fill="none" stroke="#1F2A44" stroke-width="9"/>
      <circle cx="95" cy="74" r="7.5" fill="#F5F1E8" stroke="#1F2A44" stroke-width="2.5"/>
      <path d="M102 62 q4 -3 6 1 M104 70 q4 0 5 3" fill="none" stroke="#E8792B" stroke-width="2.2"/>
      <!-- 몸 (작게) -->
      <path d="M30 124 Q31 96 56 94 Q81 96 82 124 Z" fill="#1F2A44"/>
      <path d="M46 95 L56 106 L66 95 Z" fill="#F5F1E8"/>
      <path d="M56 104 L48 99 L48 109 Z M56 104 L64 99 L64 109 Z" fill="#E8792B"/>
      <circle cx="56" cy="104" r="2.6" fill="#E8792B"/>
      <circle cx="56" cy="115" r="1.8" fill="#F5F1E8"/>
      <!-- 회중시계 든 손 -->
      <circle cx="31" cy="108" r="10" fill="#F5F1E8" stroke="#E8792B" stroke-width="3.2"/>
      <path d="M31 108 V102 M31 108 L35 110" stroke="#1F2A44" stroke-width="2"/>
      <circle cx="31" cy="96.5" r="2" fill="#E8792B"/>
      <!-- 머리 (크게) -->
      <ellipse cx="56" cy="64" rx="31" ry="29" fill="#F5F1E8" stroke="#1F2A44" stroke-width="3"/>
      <path d="M26 58 q-5 6 1 11 M86 58 q5 6 -1 11" fill="none" stroke="#1F2A44" stroke-width="3"/>
      <!-- 눈 · 눈썹 -->
      <path d="M39 58 q5 -4 10 0 M63 58 q5 -4 10 0" fill="none" stroke="#1F2A44" stroke-width="2.4"/>
      <ellipse cx="44" cy="67" rx="4.6" ry="6.2" fill="#1F2A44"/><circle cx="45.8" cy="64.4" r="1.9" fill="#F5F1E8"/>
      <ellipse cx="68" cy="67" rx="4.6" ry="6.2" fill="#1F2A44"/><circle cx="69.8" cy="64.4" r="1.9" fill="#F5F1E8"/>
      <!-- 볼 · 입 -->
      <ellipse cx="35" cy="77" rx="5.5" ry="3.2" fill="#E8792B" opacity=".35"/>
      <ellipse cx="77" cy="77" rx="5.5" ry="3.2" fill="#E8792B" opacity=".35"/>
      <path d="M49 77 Q56 86 63 77 Z" fill="#1F2A44"/>
      <path d="M52.5 81.5 Q56 84 59.5 81.5" fill="none" stroke="#E8792B" stroke-width="2.2"/>
      <!-- 역무원 모자 (크게, 살짝 기울임) -->
      <g transform="rotate(-7 56 34)">
        <path d="M23 44 Q20 10 56 8 Q92 10 89 44 Z" fill="#1F2A44"/>
        <rect x="23" y="35" width="66" height="9" rx="2" fill="#F5F1E8" stroke="#1F2A44" stroke-width="2"/>
        <path d="M20 44 Q56 57 92 44 L89 50 Q56 63 23 50 Z" fill="#1F2A44"/>
        <path d="M43 21 L50 24 L56 18 L62 24 L69 21 L62 29 H50 Z" fill="#E8792B"/>
        <circle cx="56" cy="23" r="3" fill="#F5F1E8"/>
        <path d="M33 18 Q38 13 44 12" fill="none" stroke="#F5F1E8" stroke-width="2" opacity=".5"/>
      </g>
    </svg>
    <div class="bubble">돌아가는 기차가 몇 시예요?</div>
  </div>
  <div class="guide">남은 시간만 알려 주세요. 그 안에 볼 것을 골라 드려요.</div>

  <!-- ② -->
  <div class="wheel">
    <div class="col"><span>4</span><span class="sel">5</span><span>6</span></div>
    <div class="col"><span>50</span><span class="sel">00</span><span>10</span></div>
  </div>
  <div class="label">기차가 아니면</div>
  <div class="row3">
    <button class="chip">1시간</button><button class="chip">2시간</button><button class="chip">반나절</button>
  </div>

  <!-- ③ -->
  <div class="title">누구와 왔어요?</div>
  <div class="grid">
    <button class="chip">혼자</button><button class="chip">친구·연인</button>
    <button class="chip">아이와</button><button class="chip">부모님과</button>
  </div>

  <!-- ④ -->
  <div class="foot"><button class="go">코스 받기</button></div>
</div>
</body>
</html>
