<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC 전시 결과 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 앱 시안. 담백하고 정보 위주
   IDEA: 휴대폰 화면 속 추천 결과 목록
   PICTURE: 전시 포스터가 깔린 카드 자체
   COLOUR and TYPE: 짙은 남색 바탕, 흰 글씨, 종료 배지만 노랑. Noto Sans KR
   LAYOUT: 가운데 360px 휴대폰 한 대, 아래에 출처 한 줄 */
:root{color-scheme:light dark;--bg:light-dark(#e9ecf1,#0f1218);--ink:light-dark(#151922,#e8ebf0);--muted:light-dark(#5a6170,#9aa2b1);--frame:light-dark(#ffffff,#1a1f29);--line:light-dark(#d4d9e2,#2a3140)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{padding:clamp(20px,4vw,48px) 12px;display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:20px;font-weight:700;margin:0;text-align:center}
.phone{width:min(380px,100%);background:var(--frame);border:1px solid var(--line);border-radius:28px;padding:18px 12px 14px}
.head{font-size:13px;color:var(--muted);margin:0 4px 12px}
.card{position:relative;border-radius:14px;overflow:hidden;margin-bottom:12px;color:#fff;background:#222 top center/cover no-repeat;aspect-ratio:445/630;display:flex;flex-direction:column;justify-content:flex-end}
.card:last-child{margin-bottom:0}
.ov{position:relative;background:linear-gradient(to bottom,rgba(8,10,16,0),rgba(8,10,16,.78) 28px);padding:34px 16px 14px}
.t{font-size:16px;font-weight:700;margin:0;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.m{font-size:13px;color:rgba(255,255,255,.82);margin:2px 0 10px}
.r{font-size:14px;line-height:1.6;margin:0;display:flex;gap:8px}
.r::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);margin-top:9px}
.q{color:rgba(255,255,255,.6)}
.b{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:#ffd36b;color:#3d2a00;white-space:nowrap}
.rv{background:rgba(255,255,255,.14);border-radius:8px;padding:8px 10px;margin-top:10px}
.rl{font-size:13px;line-height:1.55;margin:0;display:flex;gap:8px}
.rl span{flex:none;width:44px;font-weight:700}
.p span{color:#a5e07a}.n span{color:#ff9f9f}.z{color:rgba(255,255,255,.6)}.z span{color:rgba(255,255,255,.6)}
details{margin-top:8px;font-size:13px;color:rgba(255,255,255,.85)}
summary{cursor:pointer;font-size:13px;color:#a9d2ff;min-height:28px;display:flex;align-items:center}
summary:focus-visible{outline:2px solid #a9d2ff;outline-offset:2px;border-radius:4px}
.note{font-size:13px;color:var(--muted);text-align:center;max-width:380px;margin:0}
</style>
</head>
<body>
<div class="wrap">
<h1>추천 전시 결과 카드 시안</h1>
<div class="phone">
<p class="head">추천 전시</p>
<div id="list"></div>
</div>
<p class="note">포스터 출처: ACC 국립아시아문화전당 공식 누리집 현재전시 (2026-11-25). 팀 내부 시안용.</p>
</div>
<script>
{
const D=[
{img:"acc_posters/impressionism.jpg",t:"인상파, 찬란한 순간들",m:"문화창조원 · 60분 · 성인 13,000원",tips:["주말 매표 대기, 사전 예매 권장","QR 오디오 해설, 개인 이어폰 필요"],pos:"모네·고흐 원화를 직접 봄",neg:"작품 수가 적어 금방 끝남",more:"청소년·어린이 10,000원 · 수·토 20:00까지 운영 · 메인 3점: 모네 수련, 고흐 양귀비, 르누아르 장미"},
{img:"acc_posters/nomad.gif",t:"길 위의 노마드",m:"아시아문화박물관 · 60분 · 무료",tips:["넓은 규모, 구역 순서대로 관람","의복 체험 대기 있음"],q:"입구 위치 (확인 필요)",pos:"체험이 많아 지루하지 않음",neg:"붐비면 천천히 보기 어려움",more:"카라반사라이 → 바자르 → 초원 → 360도 영상"},
{img:"acc_posters/monsoon.jpg",t:"몬순으로 열린 세계",end:"12/31 종료",m:"아시아문화박물관 · 45분 · 무료",tips:["예상보다 긴 관람 시간","VR 대기 있음"],pos:"영상·VR·향 체험이 다양함",neg:"붐빌 때 차분히 보기 어려움",more:"노마드와 이어진 전시실. 항해 → 향신료 → 체험존 → VR"},
{img:"acc_posters/sikgaek.gif",t:"식객: 맛의 뒤편",end:"12/13 종료",m:"어린이문화원 · 45분 · 일반 10,000원",tips:["한 방향 동선","할인 다수 (문화패스 5,000원)"],pos:"만화를 몰라도 쉽게 즐김",neg:"전시 규모가 작음",more:"만 6세 이하 무료 · 할인 중복 불가 · 흑백 원화 → 염전 미니어처 → QR 메뉴 추천 → 작업실"},
{img:"acc_posters/kimyoungeun.jpg",t:"김영은 《이동하는 소리》",m:"문화창조원 · 60분 · 무료",tips:["매시 정각 시작","리플렛 사전 확인 권장"],q:"입구 위치 (확인 필요)",pos:"스피커에 둘러싸인 소리 몰입",neg:"주제가 어렵게 느껴짐",more:"헤드폰 시 낭송 → 스피커 공간. 자리마다 다른 소리"},
{img:"acc_posters/mithila.jpg",t:"미틸라 회화",m:"아시아문화박물관 · 20분 · 무료",tips:["안내 영상 먼저 관람 권장","그리기 체험 대기 있음"],pos:"촘촘한 문양과 선명한 색채",neg:null,negNone:"뚜렷한 불만 후기 없음",more:"노마드·몬순과 같은 건물"},
{img:"acc_posters/speculative.jpg",t:"사변적 공동체",end:"11/29 종료",m:"문화창조원 · 40분 · 무료",tips:[],pos:"제목보다 쉬운 전시",neg:null,negNone:"부정 후기 없음"}
];
const card=d=>`<div class="card" style="background-image:url('${d.img}')"><div class="ov">
<p class="t">${d.t}${d.end?`<span class="b">${d.end}</span>`:""}</p><p class="m">${d.m}</p>
${d.tips.map(x=>`<p class="r">${x}</p>`).join("")}${d.q?`<p class="r q">${d.q}</p>`:""}
<div class="rv"${d.tips.length?"":' style="margin-top:0"'}><p class="rl p"><span>좋음</span>${d.pos}</p>
${d.neg?`<p class="rl n"><span>아쉬움</span>${d.neg}</p>`:`<p class="rl z"><span>아쉬움</span>${d.negNone}</p>`}</div>
${d.more?`<details><summary>더 보기</summary>${d.more}</details>`:""}</div></div>`;
document.getElementById("list").innerHTML=D.map(card).join("");
}
</script>
</body>
</html>
