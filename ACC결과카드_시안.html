<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC 전시 결과 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 앱 시안. 담백하고 정보 위주
   IDEA: 휴대폰 화면 속 추천 결과 목록
   PICTURE: 전시 포스터가 깔린 카드 자체
   COLOUR and TYPE: 짙은 남색 바탕, 흰 글씨, 종료 배지만 노랑. Noto Sans KR
   LAYOUT: 가운데 360px 휴대폰 한 대, 아래에 출처 한 줄 */
:root{color-scheme:light dark;--bg:light-dark(#e9ecf1,#0f1218);--ink:light-dark(#151922,#e8ebf0);--muted:light-dark(#5a6170,#9aa2b1);--frame:light-dark(#ffffff,#1a1f29);--line:light-dark(#d4d9e2,#2a3140)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{padding:clamp(20px,4vw,48px) 12px;display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:20px;font-weight:700;margin:0;text-align:center}
.phone{width:min(380px,100%);background:var(--frame);border:1px solid var(--line);border-radius:28px;padding:18px 12px 14px}
.head{font-size:13px;color:var(--muted);margin:0 4px 12px}
.card{position:relative;border-radius:14px;overflow:hidden;margin-bottom:12px;color:#fff;background:#222 top center/cover no-repeat;aspect-ratio:445/630;display:flex;flex-direction:column;justify-content:flex-end}
.card:last-child{margin-bottom:0}
.ov{position:relative;background:linear-gradient(to bottom,rgba(8,10,16,0),rgba(8,10,16,.78) 28px);padding:34px 16px 14px}
.t{font-size:16px;font-weight:700;margin:0;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.m{font-size:13px;color:rgba(255,255,255,.82);margin:2px 0 0}
.h{font-size:13px;font-weight:500;color:#fff;margin:2px 0 10px}
.r{font-size:14px;line-height:1.6;margin:0;display:flex;gap:8px}
.r::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);margin-top:9px}
.q{color:rgba(255,255,255,.6)}
.b{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:#ffd36b;color:#3d2a00;white-space:nowrap}
.rv{background:rgba(255,255,255,.14);border-radius:8px;padding:8px 10px;margin-top:10px}
.rl{font-size:13px;line-height:1.55;margin:0;display:flex;gap:8px}
.rl span{flex:none;width:44px;font-weight:700}
.p span{color:#a5e07a}.n span{color:#ff9f9f}.z{color:rgba(255,255,255,.6)}.z span{color:rgba(255,255,255,.6)}
details{margin-top:8px;font-size:13px;color:rgba(255,255,255,.85)}
summary{cursor:pointer;font-size:13px;color:#a9d2ff;min-height:28px;display:flex;align-items:center}
summary:focus-visible{outline:2px solid #a9d2ff;outline-offset:2px;border-radius:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 12px}.bar .head{margin:0}
.pick{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pick input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-height:32px}
.mo{margin:4px 0 0}
.new{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#ff5a4e;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.note{font-size:13px;color:var(--muted);text-align:center;max-width:380px;margin:0}
</style>
</head>
<body>
<div class="wrap">
<h1>추천 전시 결과 카드 시안</h1>
<div class="phone">
<div class="bar"><p class="head" id="head">추천 전시</p><label class="pick">방문일 <input type="date" id="day"></label></div>
<div id="list"></div>
</div>
<p class="note">포스터 출처: ACC 국립아시아문화전당 공식 누리집 현재전시 (2026-11-25). 팀 내부 시안용.</p>
</div>
<script>
{
const D=[
{img:"acc_posters/impressionism.jpg",t:"인상파, 찬란한 순간들",start:"2026-09-23",m:"문화창조원 · 60분 · 성인 13,000원",close:[18,20],entry:-60,tips:["주말 매표 대기, 사전 예매 권장","QR 오디오 해설, 개인 이어폰 필요"],pos:"모네·고흐 원화를 직접 봄",neg:"작품 수가 적어 금방 끝남",more:"청소년·어린이 10,000원 · 전시해설 11:00·14:00·16:00 · 메인 3점: 모네 수련, 고흐 양귀비, 르누아르 장미"},
{img:"acc_posters/nomad.gif",t:"길 위의 노마드",start:"2025-11-25",m:"아시아문화박물관 · 60분 · 무료",close:[18,20],tips:["넓은 규모, 구역 순서대로 관람","의복 체험 대기 있음"],q:"입구 위치 (확인 필요)",pos:"체험이 많아 지루하지 않음",neg:"붐비면 천천히 보기 어려움",more:"카라반사라이 → 바자르 → 초원 → 360도 영상"},
{img:"acc_posters/monsoon.jpg",t:"몬순으로 열린 세계",start:"2024-01-30",end:"2026-12-31",closed:["2026-11-30","2026-12-10"],m:"아시아문화박물관 · 45분 · 무료",close:[18,20],tips:["예상보다 긴 관람 시간","VR 대기 있음"],pos:"영상·VR·향 체험이 다양함",neg:"붐빌 때 차분히 보기 어려움",more:"노마드와 이어진 전시실. 항해 → 향신료 → 체험존 → VR"},
{img:"acc_posters/sikgaek.gif",t:"식객: 맛의 뒤편",start:"2026-09-17",end:"2026-12-13",m:"어린이문화원 · 45분 · 일반 10,000원",close:[18,18],entry:"17:30",tips:["한 방향 동선","할인 다수 (문화패스 5,000원)"],pos:"만화를 몰라도 쉽게 즐김",neg:"전시 규모가 작음",more:"만 6세 이하 무료 · 할인 중복 불가 · 흑백 원화 → 염전 미니어처 → QR 메뉴 추천 → 작업실"},
{img:"acc_posters/kimyoungeun.jpg",t:"김영은 《이동하는 소리》",start:"2026-09-03",m:"문화창조원 · 60분 · 무료",close:[18,20],tips:["매시 정각 시작","리플렛 사전 확인 권장"],q:"입구 위치 (확인 필요)",pos:"스피커에 둘러싸인 소리 몰입",neg:"주제가 어렵게 느껴짐",more:"헤드폰 시 낭송 → 스피커 공간. 자리마다 다른 소리"},
{img:"acc_posters/mithila.jpg",t:"미틸라 회화",start:"2026-08-20",m:"아시아문화박물관 · 20분 · 무료",close:[18,20],tips:["안내 영상 먼저 관람 권장","그리기 체험 대기 있음"],pos:"촘촘한 문양과 선명한 색채",neg:null,negNone:"뚜렷한 불만 후기 없음",more:"노마드·몬순과 같은 건물"},
{img:"acc_posters/speculative.jpg",t:"사변적 공동체",start:"2026-11-19",end:"2026-11-29",m:"문화창조원 · 40분 · 무료",close:[18,20],tips:[],pos:"제목보다 쉬운 전시",neg:null,negNone:"부정 후기 없음"}
];
// 날짜 정보는 모두 고른 방문일 기준 (기본: 오늘, 한국 시간). 주소 끝 ?date=2026-12-02 로도 지정 가능
const qd=new URLSearchParams(location.search).get("date");
const kst=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const ORDER=[2,3,4,5,6,0];const DN="일월화수목금토";
const md=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`;
const hm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const close=(d,w)=>(w===3||w===6?d.close[1]:d.close[0])*60;
// 요일별 값: 입장 마감이 공지된 전시는 입장 마감, 아니면 관람 종료 시각
const val=(d,w)=>typeof d.entry==="string"?d.entry:hm(close(d,w)+(d.entry||0));
const label=d=>d.entry!=null?"입장 마감":"관람 마감";
const groups=d=>{const g=[];for(const w of ORDER){const v=val(d,w);let x=g.find(y=>y.v===v);if(!x)g.push(x={v,days:[]});x.days.push(w)}
  return g.sort((a,b)=>b.v.localeCompare(a.v)).map(x=>({v:x.v,days:x.days.length===6?"화~일":x.days.map(w=>DN[w]).join("·")}))};
const hours=(d,w)=>{
  if(w===1)return"월요일 휴관";
  return`${label(d)} ${val(d,w)}`;
};
const week=d=>`${label(d)}: `+groups(d).map(x=>`${x.days} ${x.v}`).join(", ")+", 월 휴관";
const badges=(d,day)=>{
  let b="";
  if(d.closed&&day<=d.closed[1])b+=`<span class="b">${md(d.closed[0])}~${md(d.closed[1])} 휴실</span>`;
  if(d.end)b+=`<span class="b">${day===d.end?"당일 종료":`${md(d.end)} 종료`}</span>`;
  return b;
};
// 새 전시: 방문일 기준 시작 후 NEW_DAYS일 이내
const NEW_DAYS=14;
const isNew=(d,day)=>d.start&&day>=d.start&&(new Date(day)-new Date(d.start))/864e5<NEW_DAYS;
const card=(d,day,w)=>`<div class="card" style="background-image:url('${d.img}')">${isNew(d,day)?`<span class="new">새 전시</span>`:""}<div class="ov">
<p class="t">${d.t}${badges(d,day)}</p><p class="m">${d.m}</p><p class="h">${hours(d,w)}</p>
${d.tips.map(x=>`<p class="r">${x}</p>`).join("")}${d.q?`<p class="r q">${d.q}</p>`:""}
<div class="rv"><p class="rl p"><span>좋음</span>${d.pos}</p>
${d.neg?`<p class="rl n"><span>아쉬움</span>${d.neg}</p>`:`<p class="rl z"><span>아쉬움</span>${d.negNone}</p>`}</div>
<details><summary>더 보기</summary><p class="mo">${week(d)}</p>${d.more?`<p class="mo">${d.more}</p>`:""}</details></div></div>`;
const render=day=>{
  const w=new Date(day+"T00:00:00Z").getUTCDay();
  const live=D.filter(d=>!(d.end&&day>d.end)&&!(d.closed&&day>=d.closed[0]&&day<=d.closed[1]));
  document.getElementById("head").textContent=`추천 전시 · ${md(day)} (${DN[w]})`;
  document.getElementById("list").innerHTML=live.map(d=>card(d,day,w)).join("");
};
const inp=document.getElementById("day");
inp.min=kst;inp.value=/^\d{4}-\d{2}-\d{2}$/.test(qd||"")?qd:kst;
inp.addEventListener("change",()=>{if(inp.value)render(inp.value)});
render(inp.value);
}
</script>
</body>
</html>
